name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Publishing the build output means committing to the gh-pages branch.
permissions:
  contents: write

# One deploy at a time; queue new pushes rather than cancelling them, so the
# gh-pages branch is never written by two runs at once.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Branch that holds the built site. Point Settings -> Pages at this branch.
  PUBLISH_BRANCH: gh-pages

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Build
        # A project site is served from https://<owner>.github.io/<repo>/, so the
        # app needs that prefix baked in. For a custom domain, set BASE_PATH="".
        run: |
          export BASE_PATH="/${GITHUB_REPOSITORY#*/}"
          echo "Building with base path '${BASE_PATH}'"
          npm run build

      - name: Prepare artifact
        # Branch-based Pages runs Jekyll, which drops files and folders whose
        # names start with an underscore - including SvelteKit's _app directory.
        run: touch build/.nojekyll

      - name: Publish to ${{ env.PUBLISH_BRANCH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # The branch holds generated output only, so each deploy replaces it with
        # a single fresh commit rather than accumulating history.
        run: |
          cd build
          git init -q -b "$PUBLISH_BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA} from ${GITHUB_REF_NAME}"
          git push -f \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "$PUBLISH_BRANCH"
